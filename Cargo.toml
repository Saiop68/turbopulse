[package]
name = "turbopulse"
version = "1.0.7"
edition = "2021"
authors = ["TurboPulse Core Team"]
description = "Production-grade distributed rate limiting & native job queue engine for Node.js using napi-rs"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "async", "tokio_rt", "serde-json"] }
napi-derive = "2.16"
tokio = { version = "1.38", features = ["full"] }
dashmap = "6.0"
redis = { version = "0.26", features = ["tokio-comp", "connection-manager", "aio", "cluster-async"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam = "0.8"
futures = "0.3"
uuid = { version = "1.9", features = ["v4", "fast-rng"] }
thiserror = "1.0"
rand = "0.8"
async-trait = "0.1"

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
