name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '**/*.gitignore'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npx @napi-rs/cli build --platform --release --target x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npx @napi-rs/cli build --platform --release --target x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npx @napi-rs/cli build --platform --release --target aarch64-apple-darwin

    name: stable - ${{ matrix.settings.target }} - node@20
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm install

      - name: Build Native Binary
        run: ${{ matrix.settings.build }}

      - name: Mirror turbopulse.node
        run: node -e "const fs = require('fs'); fs.readdirSync('.').forEach(f => { if (f.startsWith('turbopulse') && f.endsWith('.node')) { fs.copyFileSync(f, 'turbopulse.node'); console.log('Mirrored', f, 'to turbopulse.node'); } });"

      - name: Compile TypeScript
        run: npm run build:ts

      - name: Run Test Suites
        run: |
          npm run typecheck
          npm run test:validation
          npm run test:limiter-dropin
          npm run test:queue-dropin

      - name: Upload Native Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: turbopulse.*.node
          if-no-files-found: error
